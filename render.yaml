services:
  - type: web
    name: geoc-reference26-inference
    runtime: python
    plan: free
    buildCommand: pip install -r deployment/requirements-api.txt
    startCommand: uvicorn deployment.inference_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
