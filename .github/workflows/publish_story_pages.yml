name: Validate alternate AgroCebada story (nonpublishing)

on:
  pull_request:
    paths:
      - "website/**"
      - "scripts/529_check_story_site.py"
      - "results/current_champions/v1/metrics.csv"
      - "results/comparison_97_41/v1/metrics.csv"
      - "README.md"
      - ".github/workflows/publish_story_pages.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/529_check_story_site.py"
      - "results/current_champions/v1/metrics.csv"
      - "results/comparison_97_41/v1/metrics.csv"
      - "README.md"
      - ".github/workflows/publish_story_pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agrocebada-story-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public metrics, links and privacy
        run: python scripts/529_check_story_site.py

